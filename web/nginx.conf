server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't cache the app shell / service worker, so rebuilds take effect
    # immediately (avoids the blank-screen-after-redeploy problem).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # The app bundle + loader change on every build but keep stable filenames,
    # so the browser would otherwise serve them stale (blank/old app after a
    # redeploy). Never cache them.
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: deep links (/inventory, /scan, ...) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
